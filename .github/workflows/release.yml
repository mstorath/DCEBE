# Template — copy to `.github/workflows/release.yml` to enable.
#
# Tag-gated PyPI publication via OIDC trusted publishing. No PyPI API
# token required after one-time configuration on PyPI side. Triggers
# only on annotated tags matching `v*.*.*`.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dcebe
    permissions:
      id-token: write     # required for OIDC trusted publishing
      contents: write     # required for the GitHub Release step below
    steps:
      - name: Checkout (for CHANGELOG.md if present)
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` argument — OIDC trusted publisher (configure
        # at https://pypi.org/manage/account/publishing/ before the
        # first release).

      - name: Extract release notes from CHANGELOG.md (or fall through)
        # Pulls the section bounded by `## <ver>` (bracket-tolerant) and
        # the next `## ` heading. DCEBE doesn't have a CHANGELOG.md yet —
        # this step writes a stub link to the tag's commits, and the
        # release-creation step's `generate_release_notes: true` provides
        # an auto-generated PR/commit summary as the visible content.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" '
              $0 ~ "^## \\[?" ver "\\]?( |$)" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          [ -s release-notes.md ] || echo "See [tag commits](https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME})." > release-notes.md

      - name: Create GitHub Release
        # Idempotent: updates an existing Release for this tag rather
        # than erroring, so manual pre-creation never blocks a re-run.
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*

      - name: Verify uploaded package (real install + import)
        # Defends against silent failures where PyPI accepts the upload
        # but the package isn't actually usable (renamed module, missing
        # __init__, broken native binding, ABI mismatch, etc.).
        # Mirrors CMF v0.1.7's step — see devcontainer reports/11.
        # DCEBE's first release will exercise this; the import alone
        # proves the wheel installs and the C++ binding loads. A
        # representative `estimate_bat(...)` call can be added once the
        # public API is finalised in the port.
        run: |
          # Brief delay so PyPI's CDN settles the new version.
          sleep 30
          pip install --no-cache-dir --index-url https://pypi.org/simple/ dcebe
          python -c "
          import dcebe
          from importlib.metadata import version
          assert hasattr(dcebe, 'estimate_bat'), 'estimate_bat missing from public API'
          print(f'dcebe {version(\"dcebe\")} verify OK')
          "
